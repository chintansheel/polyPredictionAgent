<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Polymarket Research Agent — Feed</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0d10;
    --panel: #14181d;
    --panel-2: #1a2027;
    --border: #232a33;
    --text: #e7ecf3;
    --muted: #8a96a4;
    --accent: #6ea8ff;
    --good: #5dd39e;
    --bad: #ff7676;
    --warn: #ffb454;
    --fair: #b8a4ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text",
      "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
  }
  header {
    padding: 32px 24px 16px;
    max-width: 980px;
    margin: 0 auto;
  }
  header h1 {
    margin: 0 0 4px;
    font-size: 24px;
    letter-spacing: -0.01em;
  }
  header p {
    margin: 0;
    color: var(--muted);
    font-size: 14px;
  }
  .stats {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    padding: 16px 24px;
    max-width: 980px;
    margin: 0 auto;
  }
  .stat {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 13px;
    color: var(--muted);
  }
  .stat strong { color: var(--text); font-weight: 600; }
  main {
    max-width: 980px;
    margin: 0 auto;
    padding: 12px 24px 64px;
    display: grid;
    gap: 18px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
  }
  .card-head {
    padding: 18px 20px 12px;
    border-bottom: 1px solid var(--border);
  }
  .card-head .question {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0 0 6px;
  }
  .card-head .meta-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    font-size: 12px;
    color: var(--muted);
  }
  .pill {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px 10px;
    font-size: 12px;
    color: var(--muted);
  }
  .pill.verdict-underpriced { color: var(--good); border-color: rgba(93,211,158,0.35); }
  .pill.verdict-overpriced  { color: var(--bad);  border-color: rgba(255,118,118,0.35); }
  .pill.verdict-fair        { color: var(--fair); border-color: rgba(184,164,255,0.35); }
  .pill.status-failed       { color: var(--bad);  border-color: rgba(255,118,118,0.35); }
  .pill.mode-reanalysis     { color: var(--warn); border-color: rgba(255,180,84,0.35); }

  .card-body {
    padding: 16px 20px 20px;
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 22px;
  }
  @media (max-width: 720px) {
    .card-body { grid-template-columns: 1fr; }
  }
  h3.section {
    margin: 0 0 6px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    font-weight: 600;
  }
  .plain-english {
    font-size: 15px;
    margin: 0 0 14px;
  }
  .sub-pred {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 14px;
  }
  .sub-pred .value {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.01em;
    display: flex;
    gap: 12px;
    align-items: baseline;
  }
  .sub-pred .range { color: var(--muted); font-size: 14px; font-weight: 400; }
  .sub-pred ul {
    margin: 8px 0 0;
    padding-left: 18px;
    font-size: 13px;
  }
  .sub-pred ul li { margin-bottom: 4px; }
  .invalidation {
    margin-top: 10px;
    font-size: 13px;
    color: var(--muted);
    border-left: 2px solid var(--warn);
    padding-left: 10px;
  }
  .conf-bar {
    height: 6px;
    border-radius: 999px;
    background: var(--panel);
    overflow: hidden;
    margin-top: 6px;
  }
  .conf-bar > span {
    display: block;
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--good));
  }
  .components {
    display: grid;
    gap: 8px;
  }
  .component {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
  }
  .component .name {
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    font-size: 11px;
    margin-bottom: 2px;
  }
  .dir-up    { color: var(--good); }
  .dir-down  { color: var(--bad);  }
  .dir-neutral { color: var(--muted); }
  .verdict {
    margin-top: 14px;
    border-top: 1px dashed var(--border);
    padding-top: 12px;
    font-size: 13px;
    color: var(--muted);
  }
  .verdict .call {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 4px;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 60px 20px;
  }
  .changes {
    margin-top: 12px;
    background: rgba(255,180,84,0.06);
    border: 1px solid rgba(255,180,84,0.2);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
  }
  .changes h4 {
    margin: 0 0 6px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--warn);
  }
</style>
</head>
<body>
<header>
  <h1>Polymarket Research Agent — Feed</h1>
  <p>Every 2 hours the agent picks a market, investigates it across four reasoning layers, and publishes a verdict.</p>
</header>
<div class="stats" id="stats"></div>
<main id="feed">
  <div class="empty">loading feed…</div>
</main>

<script>
async function loadFeed() {
  try {
    const res = await fetch('../output/feed.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('feed not found');
    const feed = await res.json();
    render(feed.slice().reverse());
  } catch (err) {
    document.getElementById('feed').innerHTML =
      '<div class="empty">No feed yet. Run <code>python test_run.py</code> first.</div>';
  }
  try {
    const sres = await fetch('../output/scorecard.json', { cache: 'no-store' });
    if (sres.ok) renderStats(await sres.json());
  } catch (_e) { /* scorecard optional */ }
}

function fmtPct(n) {
  if (n == null || isNaN(n)) return '—';
  return Math.round(n * 100) + '%';
}
function safe(v) {
  if (v == null) return '';
  return String(v).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}

function renderStats(scorecard) {
  const sp = scorecard.sub_predictions || {};
  const mv = scorecard.market_verdicts || {};
  document.getElementById('stats').innerHTML = `
    <div class="stat">Total runs: <strong>${sp.total || 0}</strong></div>
    <div class="stat">Sub-predictions resolved: <strong>${sp.resolved || 0}</strong></div>
    <div class="stat">Sub-prediction accuracy: <strong>${fmtPct(sp.accuracy)}</strong></div>
    <div class="stat">Verdict accuracy: <strong>${fmtPct(mv.accuracy)}</strong></div>
  `;
}

function render(feed) {
  if (!feed.length) {
    document.getElementById('feed').innerHTML =
      '<div class="empty">No cards yet.</div>';
    return;
  }
  const root = document.getElementById('feed');
  root.innerHTML = '';
  for (const card of feed) {
    root.appendChild(renderCard(card));
  }
}

function renderCard(card) {
  const m = card.market || {};
  const a = card.analysis || {};
  const sub = card.sub_prediction || {};
  const v = card.verdict || {};
  const meta = card.meta || {};
  const layer3 = card.layer3 || {};
  const mode = card.mode || 'fresh';

  const el = document.createElement('div');
  el.className = 'card';

  const verdictClass = `verdict-${(v.call || 'fair')}`;
  const statusClass = card.status === 'failed' ? 'status-failed' : '';

  const components = layer3.components_researched || {};
  const compHtml = Object.keys(components).map(name => {
    const c = components[name];
    return `<div class="component">
      <div class="name">${safe(name)} <span class="dir-${safe(c.direction || 'neutral')}">${safe(c.direction || '')}</span></div>
      <div>${safe(c.finding || '')}</div>
      ${c.source ? `<div style="margin-top:4px"><a href="${safe(c.source)}" target="_blank" rel="noopener">source</a></div>` : ''}
    </div>`;
  }).join('');

  const basisHtml = (sub.basis || []).map(b => `<li>${safe(b)}</li>`).join('');

  let changesHtml = '';
  if (mode === 'reanalysis' && card.changes_since_prior) {
    const cs = card.changes_since_prior;
    const newDev = (cs.new_developments || []).map(d => `<li>${safe(d)}</li>`).join('');
    changesHtml = `<div class="changes">
      <h4>Changes since prior analysis</h4>
      <div>Probability delta: <strong>${safe(cs.probability_delta)}</strong></div>
      ${cs.prior_prediction_event_resolved !== undefined ? `<div>Prior event resolved: <strong>${cs.prior_prediction_event_resolved}</strong></div>` : ''}
      ${newDev ? `<ul>${newDev}</ul>` : ''}
    </div>`;
  }

  el.innerHTML = `
    <div class="card-head">
      <p class="question">${safe(m.question)}</p>
      <div class="meta-row">
        <span class="pill verdict ${verdictClass}">${safe(v.call || 'pending')}</span>
        ${statusClass ? `<span class="pill ${statusClass}">${safe(card.status)}</span>` : ''}
        ${mode === 'reanalysis' ? `<span class="pill mode-reanalysis">re-analysis #${card.analysis_number || ''}</span>` : ''}
        <span class="pill">prob ${fmtPct(m.probability_now)}</span>
        <span class="pill">vol 24h $${Math.round(m.volume_24hr || 0).toLocaleString()}</span>
        <span class="pill">${safe(m.category || '')}</span>
        ${m.polymarket_url ? `<a class="pill" href="${safe(m.polymarket_url)}" target="_blank" rel="noopener">polymarket ↗</a>` : ''}
        <span class="pill">${safe(card.timestamp)}</span>
      </div>
    </div>
    <div class="card-body">
      <div>
        <h3 class="section">Plain English</h3>
        <p class="plain-english">${safe(a.plain_english || '')}</p>
        ${a.key_event ? `<div style="margin-bottom:14px; font-size:13px; color:var(--muted)"><strong style="color:var(--text)">Key event:</strong> ${safe(a.key_event)}</div>` : ''}

        <div class="sub-pred">
          <h3 class="section">Sub-prediction</h3>
          <div class="value">${safe(sub.predicted_value || '—')} <span class="range">${safe(sub.predicted_range || '')}</span></div>
          <div class="conf-bar"><span style="width:${Math.round((sub.confidence || 0) * 100)}%"></span></div>
          <div style="font-size:12px;color:var(--muted);margin-top:4px">confidence ${fmtPct(sub.confidence)}</div>
          ${basisHtml ? `<ul>${basisHtml}</ul>` : ''}
          ${sub.invalidation_condition ? `<div class="invalidation"><strong>Invalidation:</strong> ${safe(sub.invalidation_condition)}</div>` : ''}
          ${sub.actual_value ? `<div style="margin-top:8px;font-size:13px"><strong>Actual:</strong> ${safe(sub.actual_value)} — ${sub.prediction_correct ? 'correct' : 'incorrect'}</div>` : ''}
        </div>

        <div class="verdict">
          <div class="call">Verdict: ${safe(v.call || '—')} (${fmtPct(v.confidence)})</div>
          <div>${safe(v.reasoning || '')}</div>
        </div>
        ${changesHtml}
      </div>
      <div>
        <h3 class="section">Layer 3 components</h3>
        <div class="components">${compHtml || '<div class="component">No component data.</div>'}</div>
        ${a.news_url ? `<div style="margin-top:14px;font-size:13px"><strong>News:</strong> <a href="${safe(a.news_url)}" target="_blank" rel="noopener">${safe(a.news_headline || a.news_url)}</a> <span style="color:var(--muted)">(${safe(a.news_source || '')})</span></div>` : ''}
        <div style="margin-top:14px;font-size:12px;color:var(--muted)">
          tools: ${(meta.tools_called || []).join(', ') || '—'}<br>
          tokens: in ${meta.total_input_tokens || 0} / out ${meta.total_output_tokens || 0}<br>
          turns: ${meta.turns || 0} · duration ${meta.run_duration_seconds || '?'}s
        </div>
      </div>
    </div>
  `;
  return el;
}

loadFeed();
</script>
</body>
</html>
