<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Foretell — Feed</title>
<link rel="stylesheet" href="/ui/theme.css" />
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
  }
  header {
    padding: 32px 24px 16px;
    max-width: 980px;
    margin: 0 auto;
  }
  header h1 {
    margin: 0 0 4px;
    font-size: 24px;
  }
  header p {
    margin: 0;
    color: var(--muted);
    font-size: 14px;
  }
  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    flex-wrap: wrap;
  }
  .user-bar {
    font-size: 13px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  .user-bar button {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 12px;
    cursor: pointer;
    font-size: 13px;
  }
  .user-bar button:hover { border-color: var(--accent); }
  .user-bar a.cta {
    background: var(--accent);
    color: #0b0d10;
    border-color: var(--accent);
    font-weight: 600;
    text-decoration: none;
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 13px;
  }
  .user-bar a.cta:hover { opacity: 0.9; }
  .stats {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    padding: 16px 24px;
    max-width: 980px;
    margin: 0 auto;
  }
  .stat {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 13px;
    color: var(--muted);
  }
  .stat strong { color: var(--text); font-weight: 600; }
  main {
    max-width: 980px;
    margin: 0 auto;
    padding: 12px 24px 64px;
    display: grid;
    gap: 18px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
  }
  .card-head {
    padding: 18px 20px 12px;
    border-bottom: 1px solid var(--border);
  }
  .card-head .question {
    font-size: 17px;
    font-weight: 600;
    margin: 0 0 6px;
  }
  .card-body {
    padding: 16px 20px 20px;
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 22px;
  }
  @media (max-width: 720px) {
    .card-body { grid-template-columns: 1fr; }
  }
  h3.section {
    margin: 0 0 6px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    font-weight: 500;
  }
  .plain-english {
    font-size: 15px;
    margin: 0 0 14px;
  }
  .sub-pred {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 14px;
  }
  .sub-pred .value {
    font-size: 22px;
    font-weight: 600;
    display: flex;
    gap: 12px;
    align-items: baseline;
  }
  .sub-pred .range { color: var(--muted); font-size: 14px; font-weight: 400; }
  .sub-pred ul {
    margin: 8px 0 0;
    padding-left: 18px;
    font-size: 13px;
  }
  .sub-pred ul li { margin-bottom: 4px; }
  .invalidation {
    margin-top: 10px;
    font-size: 13px;
    color: var(--muted);
    border-left: 2px solid var(--warn);
    padding-left: 10px;
  }
  .conf-bar {
    height: 6px;
    border-radius: 999px;
    background: var(--panel);
    overflow: hidden;
    margin-top: 6px;
  }
  .conf-bar > span {
    display: block;
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--good));
  }
  .components {
    display: grid;
    gap: 8px;
  }
  .component {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
  }
  .component .name {
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    font-size: 11px;
    margin-bottom: 2px;
  }
  .dir-up    { color: var(--good); }
  .dir-down  { color: var(--bad);  }
  .dir-neutral { color: var(--muted); }
  .verdict {
    margin-top: 14px;
    border-top: 1px dashed var(--border);
    padding-top: 12px;
    font-size: 13px;
    color: var(--muted);
  }
  .verdict .call {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 4px;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 60px 20px;
  }
  .changes {
    margin-top: 12px;
    background: rgba(255,180,84,0.06);
    border: 1px solid rgba(255,180,84,0.2);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
  }
  .changes h4 {
    margin: 0 0 6px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--warn);
  }
</style>
<script src="/ui/feed-render.js"></script>
</head>
<body>
<header>
  <div class="header-row">
    <div>
      <h1>Foretell — Feed</h1>
      <p>Your analysis history — run a new investigation anytime from New analysis.</p>
    </div>
    <div class="user-bar" id="user-bar" hidden>
      <a href="/app/run" class="cta">New analysis</a>
      <span id="user-name"></span>
      <button type="button" id="sign-out">Sign out</button>
    </div>
  </div>
</header>
<div class="stats" id="stats"></div>
<main id="feed">
  <div class="empty">loading feed…</div>
</main>

<script>
async function requireAuth() {
  const res = await fetch('/api/auth/me', { credentials: 'include' });
  if (!res.ok) {
    window.location.href = '/login';
    return null;
  }
  const user = await res.json();
  document.getElementById('user-name').textContent = user.name;
  document.getElementById('user-bar').hidden = false;
  return user;
}

document.getElementById('sign-out').addEventListener('click', async () => {
  await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
  window.location.href = '/';
});

async function loadFeed() {
  const user = await requireAuth();
  if (!user) return;
  try {
    const res = await fetch('/api/feed', { cache: 'no-store', credentials: 'include' });
    if (!res.ok) throw new Error('feed not found');
    const feed = await res.json();
    render(feed.slice().reverse());
  } catch (err) {
    document.getElementById('feed').innerHTML =
      '<div class="empty">No analyses yet. <a href="/app/run">Start your first analysis</a>.</div>';
  }
  try {
    const sres = await fetch('/api/scorecard', { cache: 'no-store', credentials: 'include' });
    if (sres.ok) {
      document.getElementById('stats').innerHTML = renderStats(await sres.json());
    }
  } catch (_e) { /* scorecard optional */ }
}

function render(feed) {
  if (!feed.length) {
    document.getElementById('feed').innerHTML =
      '<div class="empty">No analyses yet. <a href="/app/run">Start your first analysis</a>.</div>';
    return;
  }
  const root = document.getElementById('feed');
  root.innerHTML = '';
  for (const card of feed) {
    root.appendChild(renderCard(card));
  }
}

loadFeed();
</script>
</body>
</html>
