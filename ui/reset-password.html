<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset password — Foretell</title>
<link rel="stylesheet" href="/ui/theme.css" />
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--text)}
a{color:inherit;text-decoration:none}
.wrap{max-width:420px;margin:0 auto;padding:48px 24px;flex:1;width:100%}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:26px;margin-bottom:48px;justify-content:center;letter-spacing:-0.02em}
.logo-mark{width:28px;height:28px;border:1.5px solid var(--accent);border-radius:50%;display:inline-flex;align-items:center;justify-content:center}
.logo-mark::before{content:'';width:8px;height:8px;background:var(--accent);border-radius:50%}
h1{font-family:var(--serif);font-size:36px;font-weight:400;text-align:center;margin-bottom:8px;letter-spacing:-0.01em}
.sub{text-align:center;color:var(--muted);font-size:15px;margin-bottom:32px}
form{display:flex;flex-direction:column;gap:16px}
label{font-size:13px;color:var(--muted)}
input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--border);
  background:var(--panel-2);color:var(--text);font-family:inherit;font-size:15px}
input:focus{outline:none;border-color:var(--accent)}
.btn{display:flex;align-items:center;justify-content:center;padding:14px;border-radius:999px;
  font-size:15px;font-weight:500;background:var(--accent);color:var(--bg);border:none;cursor:pointer;margin-top:8px}
.btn:hover{opacity:0.9}
.btn:disabled{opacity:0.6;cursor:not-allowed}
.error{color:var(--bad);font-size:14px;text-align:center;min-height:20px;line-height:1.5}
.foot{text-align:center;margin-top:24px;font-size:14px;color:var(--muted)}
.foot a{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <a href="/" class="logo"><span class="logo-mark"></span> Foretell</a>
  <h1>New password</h1>
  <p class="sub">Choose a new password for your account.</p>
  <form id="form" hidden>
    <div>
      <label for="password">New password</label>
      <input id="password" name="password" type="password" required minlength="8" autocomplete="new-password" />
    </div>
    <div>
      <label for="confirm">Confirm password</label>
      <input id="confirm" name="confirm" type="password" required minlength="8" autocomplete="new-password" />
    </div>
    <p class="error" id="error"></p>
    <button type="submit" class="btn" id="submit">Update password</button>
  </form>
  <p class="error" id="token-error"></p>
  <p class="foot"><a href="/login">Back to sign in</a> · <a href="/forgot-password">Request new link</a></p>
</div>
<script>
const params = new URLSearchParams(window.location.search);
const token = params.get('token');
const form = document.getElementById('form');
const tokenErr = document.getElementById('token-error');

if (!token) {
  tokenErr.textContent = 'Invalid reset link. Request a new one from the forgot password page.';
} else {
  form.hidden = false;
}

document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submit');
  const err = document.getElementById('error');
  err.textContent = '';
  const password = document.getElementById('password').value;
  const confirm = document.getElementById('confirm').value;
  if (password !== confirm) {
    err.textContent = 'Passwords do not match.';
    return;
  }
  btn.disabled = true;
  try {
    const res = await fetch('/api/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, password }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      err.textContent = typeof data.detail === 'string' ? data.detail : 'Could not reset password. Try again.';
      return;
    }
    window.location.href = '/login?reset=1';
  } catch (_e) {
    err.textContent = 'Network error. Try again.';
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
