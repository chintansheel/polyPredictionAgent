<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Foretell — New analysis</title>
<link rel="stylesheet" href="/ui/theme.css" />
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
  }
  header {
    padding: 32px 24px 16px;
    max-width: 980px;
    margin: 0 auto;
  }
  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    flex-wrap: wrap;
  }
  header h1 { margin: 0 0 4px; font-size: 24px; }
  .panel h2 { font-size: 16px; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  .nav-links { display: flex; gap: 10px; align-items: center; font-size: 13px; }
  .nav-links a, .btn {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 14px;
    text-decoration: none;
    cursor: pointer;
    font-size: 13px;
  }
  .btn:hover, .nav-links a:hover { border-color: var(--accent); }
  .btn-primary {
    background: var(--accent);
    color: #0b0d10;
    border-color: var(--accent);
    font-weight: 600;
  }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  main {
    max-width: 980px;
    margin: 0 auto;
    padding: 12px 24px 64px;
    display: grid;
    gap: 20px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
  }
  .panel h2 { margin: 0 0 14px; font-size: 16px; }
  .radio-row { display: flex; gap: 20px; margin-bottom: 16px; flex-wrap: wrap; }
  .radio-row label { cursor: pointer; font-size: 14px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .tab {
    padding: 6px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    cursor: pointer;
    font-size: 13px;
  }
  .tab.active { border-color: var(--accent); color: var(--accent); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  label.field { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  input[type="text"], select {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    font-size: 14px;
    margin-bottom: 12px;
  }
  .hint { font-size: 12px; color: var(--muted); margin: -8px 0 12px; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; margin: 12px 0; font-size: 14px; }
  .preview-list { margin-top: 8px; }
  .preview-item {
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 8px;
    font-size: 13px;
    background: var(--panel-2);
  }
  .preview-item strong { display: block; margin-bottom: 4px; color: var(--text); }
  .status-box {
    padding: 14px 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    font-size: 14px;
  }
  .status-box.running { border-color: var(--accent); }
  .status-box.failed { border-color: var(--bad); color: var(--bad); }
  .status-box.done { border-color: var(--good); }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--muted); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #result-card .card { margin-top: 0; }
  /* card styles synced with feed */
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
  .card-head { padding: 18px 20px 12px; border-bottom: 1px solid var(--border); }
  .card-head .question { font-size: 17px; font-weight: 600; margin: 0 0 6px; }
  .card-body {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 22px;
    padding: 16px 20px 20px;
  }
  @media (max-width: 720px) { .card-body { grid-template-columns: 1fr; } }
  h3.section {
    margin: 0 0 6px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    font-weight: 500;
  }
  .plain-english { font-size: 15px; margin: 0 0 14px; }
  .sub-pred {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 14px;
  }
  .sub-pred .value {
    font-size: 22px;
    font-weight: 600;
    display: flex;
    gap: 12px;
    align-items: baseline;
  }
  .sub-pred .range { color: var(--muted); font-size: 14px; font-weight: 400; }
  .sub-pred ul { margin: 8px 0 0; padding-left: 18px; font-size: 13px; }
  .sub-pred ul li { margin-bottom: 4px; }
  .invalidation {
    margin-top: 10px;
    font-size: 13px;
    color: var(--muted);
    border-left: 2px solid var(--warn);
    padding-left: 10px;
  }
  .conf-bar {
    height: 6px;
    border-radius: 999px;
    background: var(--panel);
    overflow: hidden;
    margin-top: 6px;
  }
  .conf-bar > span {
    display: block;
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--good));
  }
  .components { display: grid; gap: 8px; }
  .component {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
  }
  .component .name {
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    font-size: 11px;
    margin-bottom: 2px;
  }
  .dir-up    { color: var(--good); }
  .dir-down  { color: var(--bad);  }
  .dir-neutral { color: var(--muted); }
  .verdict {
    margin-top: 14px;
    border-top: 1px dashed var(--border);
    padding-top: 12px;
    font-size: 13px;
    color: var(--muted);
  }
  .verdict .call {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 4px;
  }
  .changes {
    margin-top: 12px;
    background: rgba(255,180,84,0.06);
    border: 1px solid rgba(255,180,84,0.2);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
  }
  .changes h4 {
    margin: 0 0 6px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--warn);
  }
  .failure-box { background: rgba(255,118,118,0.1); border: 1px solid rgba(255,118,118,0.3); border-radius: 8px; padding: 10px; margin-bottom: 12px; font-size: 13px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
<script src="/ui/feed-render.js"></script>
</head>
<body>
<header>
  <div class="header-row">
    <div>
      <h1>New analysis</h1>
      <p>Choose a Polymarket topic, category, or specific market. The agent runs in the background (~1–2 min).</p>
    </div>
    <div class="nav-links">
      <a href="/app">← Feed</a>
      <button type="button" class="btn" id="sign-out">Sign out</button>
    </div>
  </div>
</header>

<main>
  <section class="panel" id="form-panel">
    <h2>Run type</h2>
    <div class="radio-row">
      <label><input type="radio" name="run-mode" value="fresh" checked /> Fresh analysis</label>
      <label><input type="radio" name="run-mode" value="reanalysis" /> Re-analysis</label>
    </div>

    <div id="fresh-section">
      <div class="tabs" id="fresh-tabs">
        <button type="button" class="tab active" data-tab="topic">Topic</button>
        <button type="button" class="tab" data-tab="category">Category</button>
        <button type="button" class="tab" data-tab="market">Market ID</button>
      </div>
      <div class="tab-panel active" id="tab-topic">
        <label class="field" for="topic-input">Keyword or phrase</label>
        <input type="text" id="topic-input" placeholder='e.g. "iran war", "fed rate"' maxlength="200" />
        <button type="button" class="btn" id="preview-btn">Preview markets</button>
        <div class="preview-list" id="preview-list"></div>
      </div>
      <div class="tab-panel" id="tab-category">
        <label class="field" for="category-select">Category</label>
        <select id="category-select"><option value="">Loading…</option></select>
      </div>
      <div class="tab-panel" id="tab-market">
        <label class="field" for="market-id-input">Market ID or slug</label>
        <input type="text" id="market-id-input" placeholder="e.g. 2270330 or event slug from Polymarket URL" maxlength="128" />
        <p class="hint">Paste the numeric id or the slug from a polymarket.com/event/… URL.</p>
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="force-check" />
        <label for="force-check">Force (ignore 48h cooldown)</label>
      </div>
    </div>

    <div id="reanalysis-section" hidden>
      <label class="field" for="prior-run-select">Prior run from your feed</label>
      <select id="prior-run-select"><option value="">— or use market ID below —</option></select>
      <label class="field" for="re-market-id">Market ID (if not using prior run)</label>
      <input type="text" id="re-market-id" placeholder="Market id or slug" maxlength="128" />
    </div>

    <div style="margin-top:16px">
      <button type="button" class="btn btn-primary" id="submit-btn">Run analysis</button>
    </div>
  </section>

  <section class="panel" id="status-panel" hidden>
    <h2>Status</h2>
    <div class="status-box" id="status-box"></div>
  </section>

  <section id="result-section" hidden>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <h2 style="margin:0;font-size:16px;font-family:var(--serif)">Result</h2>
      <a href="/app" class="btn">View in feed</a>
    </div>
    <div id="result-card"></div>
  </section>
</main>

<script>
let activeFreshTab = 'topic';
let pollTimer = null;

async function requireAuth() {
  const res = await fetch('/api/auth/me', { credentials: 'include' });
  if (!res.ok) {
    window.location.href = '/login';
    return null;
  }
  return res.json();
}

document.getElementById('sign-out').addEventListener('click', async () => {
  await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
  window.location.href = '/';
});

document.querySelectorAll('input[name="run-mode"]').forEach(r => {
  r.addEventListener('change', () => {
    const isFresh = document.querySelector('input[name="run-mode"]:checked').value === 'fresh';
    document.getElementById('fresh-section').hidden = !isFresh;
    document.getElementById('reanalysis-section').hidden = isFresh;
  });
});

document.querySelectorAll('#fresh-tabs .tab').forEach(btn => {
  btn.addEventListener('click', () => {
    activeFreshTab = btn.dataset.tab;
    document.querySelectorAll('#fresh-tabs .tab').forEach(b => b.classList.toggle('active', b === btn));
    document.querySelectorAll('#fresh-section .tab-panel').forEach(p => {
      p.classList.toggle('active', p.id === 'tab-' + activeFreshTab);
    });
  });
});

async function loadCategories() {
  const res = await fetch('/api/categories', { credentials: 'include' });
  if (!res.ok) return;
  const data = await res.json();
  const sel = document.getElementById('category-select');
  sel.innerHTML = '<option value="">Select category…</option>';
  for (const c of data.categories || []) {
    const opt = document.createElement('option');
    opt.value = c;
    opt.textContent = c.replace(/_/g, ' ');
    sel.appendChild(opt);
  }
}

async function loadPriorRuns() {
  const res = await fetch('/api/feed', { credentials: 'include' });
  if (!res.ok) return;
  const feed = await res.json();
  const sel = document.getElementById('prior-run-select');
  sel.innerHTML = '<option value="">— or use market ID below —</option>';
  for (const card of feed.slice().reverse()) {
    const opt = document.createElement('option');
    opt.value = card.id;
    const q = (card.market || {}).question || card.id;
    opt.textContent = q.length > 80 ? q.slice(0, 77) + '…' : q;
    sel.appendChild(opt);
  }
}

document.getElementById('preview-btn').addEventListener('click', async () => {
  const q = document.getElementById('topic-input').value.trim();
  if (!q) return;
  const list = document.getElementById('preview-list');
  list.innerHTML = '<p class="hint">Searching…</p>';
  const res = await fetch('/api/markets/search?q=' + encodeURIComponent(q), { credentials: 'include' });
  if (!res.ok) {
    list.innerHTML = '<p class="hint">Search failed.</p>';
    return;
  }
  const data = await res.json();
  if (!data.markets || !data.markets.length) {
    list.innerHTML = '<p class="hint">No markets found. You can still submit — the agent will try again.</p>';
    return;
  }
  list.innerHTML = data.markets.map(m => `
    <div class="preview-item">
      <strong>${safe(m.question)}</strong>
      <span>prob ${fmtPct(m.probability_now)} · vol $${Math.round(m.volume_24hr || 0).toLocaleString()}</span>
      ${m.id ? `<div class="hint">id: ${safe(m.id)}</div>` : ''}
    </div>
  `).join('');
});

function buildPayload() {
  const mode = document.querySelector('input[name="run-mode"]:checked').value;
  const payload = { mode, force: document.getElementById('force-check').checked };
  if (mode === 'fresh') {
    if (activeFreshTab === 'topic') {
      const topic = document.getElementById('topic-input').value.trim();
      if (!topic) throw new Error('Enter a topic keyword');
      payload.topic = topic;
    } else if (activeFreshTab === 'category') {
      const category = document.getElementById('category-select').value;
      if (!category) throw new Error('Select a category');
      payload.category = category;
    } else {
      const market_id = document.getElementById('market-id-input').value.trim();
      if (!market_id) throw new Error('Enter a market ID or slug');
      payload.market_id = market_id;
    }
  } else {
    const parent_run_id = document.getElementById('prior-run-select').value;
    const market_id = document.getElementById('re-market-id').value.trim();
    if (parent_run_id) payload.parent_run_id = parent_run_id;
    else if (market_id) payload.market_id = market_id;
    else throw new Error('Select a prior run or enter a market ID');
  }
  return payload;
}

function setStatus(text, klass) {
  const panel = document.getElementById('status-panel');
  const box = document.getElementById('status-box');
  panel.hidden = false;
  box.className = 'status-box ' + (klass || '');
  box.innerHTML = (klass === 'running' ? '<span class="spinner"></span>' : '') + text;
}

async function pollJob(jobId) {
  const res = await fetch('/api/runs/' + encodeURIComponent(jobId), { credentials: 'include' });
  if (!res.ok) {
    setStatus('Could not fetch job status.', 'failed');
    return;
  }
  const job = await res.json();
  if (job.status === 'queued' || job.status === 'running') {
    setStatus(job.progress || 'Running…', 'running');
    return;
  }
  clearInterval(pollTimer);
  pollTimer = null;
  document.getElementById('submit-btn').disabled = false;

  if (job.status === 'completed' && job.card) {
    setStatus('Analysis complete.', 'done');
    const root = document.getElementById('result-card');
    root.innerHTML = '';
    root.appendChild(renderCard(job.card));
    document.getElementById('result-section').hidden = false;
  } else {
    const msg = job.error || (job.card && job.card.failure_reason) || 'Run failed';
    setStatus(msg, 'failed');
    if (job.card) {
      const root = document.getElementById('result-card');
      root.innerHTML = '';
      root.appendChild(renderCard(job.card));
      document.getElementById('result-section').hidden = false;
    }
  }
}

document.getElementById('submit-btn').addEventListener('click', async () => {
  let payload;
  try {
    payload = buildPayload();
  } catch (e) {
    alert(e.message);
    return;
  }

  document.getElementById('submit-btn').disabled = true;
  document.getElementById('result-section').hidden = true;
  setStatus('Submitting…', 'running');

  const res = await fetch('/api/runs', {
    method: 'POST',
    credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });

  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    let detail = data.detail || 'Could not start run';
    if (Array.isArray(detail)) {
      detail = detail.map(d => (typeof d === 'object' && d.msg) ? d.msg : String(d)).join('; ');
    }
    setStatus(detail, 'failed');
    document.getElementById('submit-btn').disabled = false;
    return;
  }

  const jobId = data.id;
  setStatus(data.progress || 'Queued…', 'running');
  pollTimer = setInterval(() => pollJob(jobId), 2000);
  pollJob(jobId);
});

(async () => {
  if (!(await requireAuth())) return;
  await loadCategories();
  await loadPriorRuns();
})();
</script>
</body>
</html>
