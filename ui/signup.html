<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign up — Foretell</title>
<link rel="stylesheet" href="/ui/theme.css" />
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--text)}
a{color:inherit;text-decoration:none}
.wrap{max-width:420px;margin:0 auto;padding:48px 24px;flex:1;width:100%}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:26px;margin-bottom:48px;justify-content:center;letter-spacing:-0.02em}
.logo-mark{width:28px;height:28px;border:1.5px solid var(--accent);border-radius:50%;display:inline-flex;align-items:center;justify-content:center}
.logo-mark::before{content:'';width:8px;height:8px;background:var(--accent);border-radius:50%}
h1{font-family:var(--serif);font-size:36px;font-weight:400;text-align:center;margin-bottom:8px;letter-spacing:-0.01em}
.sub{text-align:center;color:var(--muted);font-size:15px;margin-bottom:32px}
form{display:flex;flex-direction:column;gap:16px}
label{font-size:13px;color:var(--muted)}
input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--border);
  background:var(--panel-2);color:var(--text);font-family:inherit;font-size:15px}
input:focus{outline:none;border-color:var(--accent)}
.btn{display:flex;align-items:center;justify-content:center;padding:14px;border-radius:999px;
  font-size:15px;font-weight:500;background:var(--accent);color:var(--bg);border:none;cursor:pointer;margin-top:8px}
.btn:hover{opacity:0.9}
.btn:disabled{opacity:0.6;cursor:not-allowed}
.error{color:var(--bad);font-size:14px;text-align:center;min-height:20px}
.foot{text-align:center;margin-top:24px;font-size:14px;color:var(--muted)}
.foot a{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <a href="/" class="logo"><span class="logo-mark"></span> Foretell</a>
  <h1>Create your account</h1>
  <p class="sub">Start your 7-day free trial. No card required.</p>
  <form id="form">
    <div>
      <label for="name">Name</label>
      <input id="name" name="name" type="text" required autocomplete="name" />
    </div>
    <div>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required autocomplete="email" />
    </div>
    <div>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required minlength="8" autocomplete="new-password" />
    </div>
    <p class="error" id="error"></p>
    <button type="submit" class="btn" id="submit">Sign up</button>
  </form>
  <p class="foot">Already have an account? <a href="/login">Sign in</a></p>
</div>
<script>
document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submit');
  const err = document.getElementById('error');
  err.textContent = '';
  btn.disabled = true;
  try {
    const res = await fetch('/api/auth/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({
        name: document.getElementById('name').value.trim(),
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
      }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      err.textContent = typeof data.detail === 'string' ? data.detail : 'Could not create account';
      return;
    }
    window.location.href = '/app';
  } catch (_e) {
    err.textContent = 'Network error. Try again.';
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
